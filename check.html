<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BAKERU 起動チェック</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>

<body style="font-family:system-ui;background:#f8fafc;padding:24px">

  <main style="max-width:720px;margin:auto;background:white;border:2px solid #0f766e;border-radius:16px;padding:24px">

    <h1 style="font-size:26px;font-weight:800;color:#065f46">
      BAKERU 起動チェック
    </h1>

    <p>
      この画面が見えていれば GitHub Pages 自体は正常です。
    </p>

    <div id="result" style="margin-top:20px;line-height:1.9"></div>

    <div id="react-test" style="margin-top:20px"></div>

  </main>

  <script>
    const r = document.getElementById('result');

    const lines = [];

    lines.push('✅ HTML: 正常');

    lines.push(
      (window.React ? '✅' : '❌') +
      ' React: ' +
      (window.React ? '読込成功' : '読込失敗')
    );

    lines.push(
      (window.ReactDOM ? '✅' : '❌') +
      ' ReactDOM: ' +
      (window.ReactDOM ? '読込成功' : '読込失敗')
    );

    r.innerHTML = lines.map(x => '<div>' + x + '</div>').join('');

    try {

      if (window.React && window.ReactDOM) {

        const el = React.createElement(
          'div',
          {
            style: {
              padding: '14px',
              background: '#dcfce7',
              borderRadius: '10px',
              fontWeight: '700'
            }
          },
          '✅ React 描画テスト成功'
        );

        const root = document.getElementById('react-test');

        if (ReactDOM.createRoot) {
          ReactDOM.createRoot(root).render(el);
        } else {
          ReactDOM.render(el, root);
        }
      }

    } catch (e) {

      r.innerHTML +=
        '<div style="color:#b91c1c">❌ React描画エラー: ' +
        String(e.message || e) +
        '</div>';
    }
  </script>

</body>
</html>
